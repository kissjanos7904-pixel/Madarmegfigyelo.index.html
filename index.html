<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Madármegfigyelés</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #1e1e1e; color: #fff; padding: 12px; padding-bottom: 85px; }
    .card { background: #2b2b2b; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    label { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; display: block; color: #bbb; }
    input { width: 100%; background: #3a3a3a; color: #fff; border: 1px solid #555; border-radius: 5px; padding: 8px; font-size: 0.95rem; margin-bottom: 8px; outline: none; }
    input:focus { border-color: #1f6aa5; }
    .row { display: flex; gap: 8px; }
    .col { flex: 1; }
    
    .faj-box { background: #333; border: 1px solid #555; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .faj-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .btn-del { background: #a93226; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    
    .qty-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .qty-item { text-align: center; }
    .qty-item span { font-size: 0.7rem; color: #aaa; }
    .qty-item input { text-align: center; padding: 6px 2px; margin-bottom: 0; font-size: 0.95rem; }
    .qty-item.total input { background: #223; color: #5dade2; font-weight: bold; }

    .btn-add { background: #1f6aa5; color: white; border: none; border-radius: 6px; padding: 10px; width: 100%; font-size: 0.95rem; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111; padding: 10px; border-top: 1px solid #444; z-index: 10; }
    .btn-save { width: 100%; background: #28a745; color: white; border: none; border-radius: 6px; padding: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h3 style="text-align:center; margin-bottom: 12px;">🦅 Madármegfigyelés</h3>

  <!-- KÖZÖS ADATOK -->
  <div class="card">
    <label>Időpont (ÉÉÉÉ.HH.NN) *</label>
    <input type="text" id="idopont" required>

    <div class="row">
      <div class="col">
        <label>Terület *</label>
        <input type="text" id="terulet" oninput="this.value = this.value.toUpperCase()" placeholder="UTM / NÉV..." required>
      </div>
      <div class="col">
        <label>Körzet</label>
        <input type="text" id="korzet" oninput="this.value = this.value.toUpperCase()" placeholder="PL. HALASTÓ...">
      </div>
    </div>

    <label>Megfigyelő 1 *</label>
    <input type="text" id="megf1" oninput="this.value = this.value.toUpperCase()" placeholder="ELSŐDLEGES MEGFIGYELŐ..." required>

    <div id="extra-megf"></div>
    <button type="button" onclick="addMegfigyelo()" style="background:none; border:1px dashed #777; color:#ccc; width:100%; padding:6px; border-radius:4px; font-size:0.8rem; margin-top:2px;">+ További megfigyelő</button>
  </div>

  <!-- FAJ GOMB -->
  <button type="button" class="btn-add" onclick="addFaj()">✚ Új faj hozzáadása (Felülre nyílik)</button>

  <!-- FAJOK LISTÁJA -->
  <div id="fajok-lista"></div>

  <!-- MENTÉS SÁV -->
  <div class="footer-bar">
    <button type="button" class="btn-save" onclick="mentes()">☁️ Mentés Táblázatba</button>
  </div>

    let fajSzamlalo = 0;
    let megfSzamlalo = 1;

    window.onload = function() {
      const ma = new Date();
      const ev = ma.getFullYear();
      const ho = String(ma.getMonth() + 1).padStart(2, '0');
      const nap = String(ma.getDate()).padStart(2, '0');
      document.getElementById("idopont").value = `${ev}.${ho}.${nap}`;

      addMegfigyelo();
      addFaj();
    };

    function addMegfigyelo() {
      megfSzamlalo++;
      const div = document.createElement("div");
      div.innerHTML = `
        <label>Megfigyelő ${megfSzamlalo}</label>
        <input type="text" class="megf-extra" oninput="this.value = this.value.toUpperCase()" placeholder="NÉV...">
      `;
      document.getElementById("extra-megf").appendChild(div);
    }

    function addFaj() {
      fajSzamlalo++;
      const container = document.getElementById("fajok-lista");
      const box = document.createElement("div");
      box.className = "faj-box";
      box.id = `faj-${fajSzamlalo}`;
      box.dataset.index = fajSzamlalo;

      box.innerHTML = `
        <div class="faj-hdr">
          <span style="font-weight:bold; color:#5dade2;">Faj #${fajSzamlalo}</span>
          <button type="button" class="btn-del" onclick="delFaj(${fajSzamlalo})">✕ Törlés</button>
        </div>

        <input list="dl-fajok" class="faj-nev" placeholder="Kezdd el gépelni a faj nevét..." required>
        <datalist id="dl-fajok">
          ${FAJOK_LISTA.map(f => `<option value="${f}">`).join('')}
        </datalist>

        <div class="qty-grid">
          <div class="qty-item"><span>pld.</span><input type="number" class="q-pld" min="0" oninput="sum(this)"></div>
          <div class="qty-item"><span>Hím</span><input type="number" class="q-him" min="0" oninput="sum(this)"></div>
          <div class="qty-item"><span>Tojó</span><input type="number" class="q-tojo" min="0" oninput="sum(this)"></div>
          <div class="qty-item"><span>Ad</span><input type="number" class="q-ad" min="0" oninput="sum(this)"></div>
          <div class="qty-item"><span>Juv</span><input type="number" class="q-juv" min="0" oninput="sum(this)"></div>
          <div class="qty-item"><span>Imm</span><input type="number" class="q-imm" min="0" oninput="sum(this)"></div>
          <div class="qty-item"><span>Pull</span><input type="number" class="q-pull" min="0" oninput="sum(this)"></div>
          <div class="qty-item total"><span>Össz</span><input type="number" class="q-ossz" readonly></div>
        </div>

        <input type="text" class="faj-megj" placeholder="Megjegyzés..." style="margin-top:6px; margin-bottom:0;">
      `;

      container.insertBefore(box, container.firstChild);
    }

    function delFaj(id) {
      if (document.querySelectorAll('.faj-box').length > 1) {
        document.getElementById(`faj-${id}`).remove();
      } else {
        alert("Legalább egy faj megadása kötelező!");
      }
    }

    function sum(el) {
      const box = el.closest('.faj-box');
      const fields = ['q-pld', 'q-him', 'q-tojo', 'q-ad', 'q-juv', 'q-imm', 'q-pull'];
      let total = 0;
      let has = false;

      fields.forEach(f => {
        const val = box.querySelector(`.${f}`).value.trim();
        if (val && !isNaN(val)) {
          total += parseInt(val, 10);
          has = true;
        }
      });

      box.querySelector('.q-ossz').value = has ? total : "";
    }

    function parseVal(v) {
      v = v.trim();
      return v !== "" && !isNaN(v) ? parseInt(v, 10) : null;
    }

    function mentes() {
      const idopont = document.getElementById("idopont").value.trim();
      const terulet = document.getElementById("terulet").value.trim();
      const korzet = document.getElementById("korzet").value.trim();
      const megf1 = document.getElementById("megf1").value.trim();

      if (!idopont || !terulet || !megf1) {
        alert("Időpont, Terület és Megfigyelő 1 megadása kötelező!");
        return;
      }

      const raw = [];
      const boxes = Array.from(document.querySelectorAll('.faj-box'));

      for (let b of boxes) {
        let faj = b.querySelector('.faj-nev').value.trim();
        if (!faj) {
          alert("Minden sornál ki kell választani a fajt!");
          return;
        }

        let pld = parseVal(b.querySelector('.q-pld').value);
        let him = parseVal(b.querySelector('.q-him').value);
        let tojo = parseVal(b.querySelector('.q-tojo').value);
        let ad = parseVal(b.querySelector('.q-ad').value);
        let juv = parseVal(b.querySelector('.q-juv').value);
        let imm = parseVal(b.querySelector('.q-imm').value);
        let pull = parseVal(b.querySelector('.q-pull').value);

        if ([pld, him, tojo, ad, juv, imm, pull].every(x => x === null)) {
          alert(`A(z) ${faj} fajnál legalább egy darabszámot be kell írni!`);
          return;
        }

        let megj = b.querySelector('.faj-megj').value.trim();
        raw.push({ faj, pld, him, tojo, ad, juv, imm, pull, megj, index: parseInt(b.dataset.index, 10) });
      }

      raw.sort((a, b) => a.index - b.index);
      const osszesit = {};
      const fajSorrend = [];

      raw.forEach(r => {
        if (!osszesit[r.faj]) {
          fajSorrend.push(r.faj);
          osszesit[r.faj] = { pld: null, him: null, tojo: null, ad: null, juv: null, imm: null, pull: null, megj: [] };
        }
        ['pld', 'him', 'tojo', 'ad', 'juv', 'imm', 'pull'].forEach(f => {
          if (r[f] !== null) {
            osszesit[r.faj][f] = (osszesit[r.faj][f] || 0) + r[f];
          }
        });
        if (r.megj && !osszesit[r.faj].megj.includes(r.megj)) {
          osszesit[r.faj].megj.push(r.megj);
        }
      });

      const megfAdatok = { "Megfigyelő 1": megf1 };
      document.querySelectorAll('.megf-extra').forEach((inp, i) => {
        const val = inp.value.trim();
        megfAdatok[`Megfigyelő ${i + 2}`] = val ? val : "";
      });

      const mentendoSorok = [];
      fajSorrend.forEach(faj => {
        const o = osszesit[faj];
        const reszek = [o.pld, o.him, o.tojo, o.ad, o.juv, o.imm, o.pull].filter(x => x !== null);
        const ossz = reszek.length > 0 ? reszek.reduce((a, b) => a + b, 0) : null;

        const rekord = {
          "Időpont": idopont,
          "Terület": terulet,
          "Körzet": korzet,
          "Faj": faj,
          "pld.": o.pld,
          "Hím": o.him,
          "Tojó": o.tojo,
          "Ad": o.ad,
          "Juv": o.juv,
          "Imm": o.imm,
          "Pull": o.pull,
          "Össz": ossz,
          "Megjegyzés": o.megj.join("; ")
        };
        Object.assign(rekord, megfAdatok);
        mentendoSorok.push(rekord);
      });

      const btn = document.querySelector('.btn-save');
      btn.innerText = "Mentés folyamatban...";
      btn.disabled = true;

      fetch(FELHO_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uj_megfigyelesek: mentendoSorok })
      })
      .then(() => {
        btn.innerText = "☁️ Mentés Táblázatba";
        btn.disabled = false;
        alert(`✅ Siker! ${mentendoSorok.length} faj sikeresen továbbítva a központi Google Táblázatba!`);
        location.reload();
      })
      .catch(err => {
        btn.innerText = "☁️ Mentés Táblázatba";
        btn.disabled = false;
        alert("Hiba a küldéskor: " + err);
      });
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
