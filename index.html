<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Madártani Adatrögzítő</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MadárApp">
  
  <link rel="manifest" href="./manifest.json?v=300">
  <link rel="apple-touch-icon" href="./icon2.png?v=300">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon2.png?v=300">
  <link rel="shortcut icon" href="./icon2.png?v=300">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #1e1e1e; color: #fff; padding: 12px; padding-bottom: 110px; }
    
    #offline-banner {
      display: none; background: #d35400; color: white; padding: 10px 14px;
      border-radius: 8px; margin-bottom: 12px; font-size: 0.88rem; font-weight: bold;
      justify-content: space-between; align-items: center;
    }
    #btn-sync-offline {
      background: #fff; color: #d35400; border: none; padding: 5px 10px;
      border-radius: 5px; font-weight: bold; font-size: 0.8rem; cursor: pointer;
    }

    .card { background: #2b2b2b; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    label { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; display: block; color: #bbb; }
    input { width: 100%; background: #3a3a3a; color: #fff; border: 1px solid #555; border-radius: 5px; padding: 8px; font-size: 0.95rem; margin-bottom: 8px; outline: none; }
    input:focus { border-color: #1f6aa5; }
    .row { display: flex; gap: 8px; }
    .col { flex: 1; }
    
    .faj-box { background: #333; border: 1px solid #555; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .faj-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .btn-del { background: #a93226; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

    .qty-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .qty-item { text-align: center; }
    .qty-item span { font-size: 0.7rem; color: #aaa; }
    .qty-item input { text-align: center; padding: 6px 2px; margin-bottom: 0; font-size: 0.95rem; }
    .qty-item.total input { background: #223; color: #5dade2; font-weight: bold; }

    .btn-add { background: #1f6aa5; color: white; border: none; border-radius: 6px; padding: 10px; width: 100%; font-size: 0.95rem; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
    
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111; padding: 10px; border-top: 1px solid #444; z-index: 10; display: flex; gap: 6px; }
    .btn-action { flex: 1; border: none; border-radius: 6px; padding: 12px 2px; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-csv { background: #007acc; color: white; }
    .btn-offline { background: #e67e22; color: white; }
    .btn-online { background: #28a745; color: white; }
  </style>
</head>
<body>

  <!-- OFFLINE SÁV -->
  <div id="offline-banner">
    <span id="offline-text">📦 0 offline felmérés várakozik</span>
    <button id="btn-sync-offline" type="button" onclick="szinkronizalOfflineAdatok()">📤 Összes feltöltése</button>
  </div>

  <h3 style="text-align:center; margin-bottom: 12px;">🦅 Madártani Adatrögzítő</h3>

  <!-- KÖZÖS ADATOK -->
  <div class="card">
    <label>Időpont (ÉÉÉÉ.HH.NN) *</label>
    <input type="text" id="idopont" required>

    <div class="row">
      <div class="col">
        <label>Terület *</label>
        <input type="text" id="terulet" oninput="this.value = this.value.toUpperCase()" placeholder="UTM / NÉV..." required>
      </div>
      <div class="col">
        <label>Körzet</label>
        <input type="text" id="korzet" oninput="this.value = this.value.toUpperCase()" placeholder="PL. HALASTÓ...">
      </div>
    </div>

    <label>Megfigyelő 1 *</label>
    <input type="text" id="megf1" oninput="this.value = this.value.toUpperCase()" placeholder="ELSŐDLEGES MEGFIGYELŐ..." required>

    <div id="extra-megf"></div>
    <button type="button" onclick="addMegfigyelo()" style="background:none; border:1px dashed #777; color:#ccc; width:100%; padding:6px; border-radius:4px; font-size:0.8rem; margin-top:2px;">+ További megfigyelő</button>
  </div>

  <!-- FAJ GOMB -->
  <button type="button" class="btn-add" onclick="addFaj()">✚ Új faj hozzáadása</button>

  <!-- FAJOK LISTÁJA -->
