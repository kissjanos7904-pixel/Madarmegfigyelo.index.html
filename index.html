<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Madár Adatrögzítő</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-hover: #15803d;
      --warn: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; padding-bottom: 90px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .header h1 { font-size: 1.2rem; font-weight: 700; }
    .btn-help-top { background: var(--border); color: var(--text); border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .label-row { display: flex; align-items: center; margin-bottom: 4px; font-size: 0.85rem; font-weight: 600; }
    .btn-q { background: #475569; color: #fff; border: none; width: 18px; height: 18px; border-radius: 50%; font-size: 0.75rem; margin-left: 6px; cursor: pointer; }
    
    input, textarea, select {
      width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 10px;
      color: var(--text); font-size: 0.95rem; outline: none; margin-bottom: 8px;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    .uppercase { text-transform: uppercase; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-num { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .num-col { display: flex; flex-direction: column; align-items: center; }
    .num-col label { font-size: 0.75rem; margin-bottom: 2px; color: var(--text-muted); }
    .num-col input { text-align: center; margin-bottom: 0; padding: 8px 4px; }
    
    .obs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .btn-small { background: var(--border); border: none; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }
    
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border);
      padding: 10px 14px; display: flex; gap: 8px; z-index: 100;
    }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: 700; font-size: 0.95rem; cursor: pointer; color: white; text-align: center; }
    .btn-save { background: var(--primary); }
    .btn-sync { background: var(--success); }
    .btn-export { background: var(--border); font-size: 0.8rem; padding: 8px; }
    
    .status-badge { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Madár Adatrögzítő</h1>
    <button class="btn-help-top" onclick="alertFullHelp()">📖 Útmutató</button>
  </div>

  <div class="card">
    <div class="label-row">
      <span>Időpont (ÉÉÉÉ.HH.NN) *</span>
      <button class="btn-q" onclick="alertHelp('Időpont')">?</button>
    </div>
    <input type="text" id="entryDate" placeholder="pl. 2026.09.14">

    <div class="grid-2">
      <div>
        <div class="label-row">
          <span>Terület *</span>
          <button class="btn-q" onclick="alertHelp('Terület')">?</button>
        </div>
        <input type="text" id="entryTerulet" class="uppercase" list="teruletList" placeholder="KÖZSÉG / UTM">
        <datalist id="teruletList"></datalist>
      </div>
      <div>
        <div class="label-row">
          <span>Körzet</span>
          <button class="btn-q" onclick="alertHelp('Körzet')">?</button>
        </div>
        <input type="text" id="entryKorzet" class="uppercase" placeholder="PL. HALASTÓ">
      </div>
    </div>

    <div class="label-row">
      <span>Faj kiválasztása *</span>
      <button class="btn-q" onclick="alertHelp('Faj')">?</button>
    </div>
    <input type="text" id="entryFaj" list="fajList" placeholder="Gépelj a fajok szűréséhez...">
    <datalist id="fajList"></datalist>

    <div class="label-row" style="margin-top: 6px;">
      <span>Mennyiségek (min. 1 kötelező) *</span>
      <button class="btn-q" onclick="alertHelp('Mennyiségek')">?</button>
    </div>
    <div class="grid-num" style="margin-bottom: 6px;">
      <div class="num-col"><label>pld.</label><input type="number" id="num_pld" min="0" oninput="calcSum()"></div>
      <div class="num-col"><label>Hím</label><input type="number" id="num_him" min="0" oninput="calcSum()"></div>
      <div class="num-col"><label>Tojó</label><input type="number" id="num_tojo" min="0" oninput="calcSum()"></div>
      <div class="num-col"><label>Ad</label><input type="number" id="num_ad" min="0" oninput="calcSum()"></div>
    </div>
    <div class="grid-num">
      <div class="num-col"><label>Juv</label><input type="number" id="num_juv" min="0" oninput="calcSum()"></div>
      <div class="num-col"><label>Imm</label><input type="number" id="num_imm" min="0" oninput="calcSum()"></div>
      <div class="num-col"><label>Pull</label><input type="number" id="num_pull" min="0" oninput="calcSum()"></div>
      <div class="num-col"><label>Össz</label><input type="number" id="num_ossz" readonly style="background:#1e293b; border-color:#475569;"></div>
    </div>
  </div>

  <div class="card">
    <div class="obs-header">
      <div class="label-row" style="margin: 0;">
        <span>Megfigyelők *</span>
        <button class="btn-q" onclick="alertHelp('Megfigyelők')">?</button>
      </div>
      <button class="btn-small" onclick="addObserverField()">+ Megfigyelő</button>
    </div>
    <div id="observerContainer">
      <input type="text" class="obs-input uppercase" list="obsList" placeholder="MEGFIGYELŐ 1 * (ELSŐDLEGES)">
      <input type="text" class="obs-input uppercase" list="obsList" placeholder="MEGFIGYELŐ 2">
    </div>
    <datalist id="obsList"></datalist>

    <div class="label-row" style="margin-top: 8px;">
      <span>Megjegyzés</span>
      <button class="btn-q" onclick="alertHelp('Megjegyzés')">?</button>
    </div>
    <textarea id="txtMegjegyzes" rows="2" placeholder="Egyéb információk..."></textarea>
  </div>

  <div class="card" style="text-align: center;">
    <button class="btn btn-export" onclick="exportToExcel()">📥 Mentett adatok letöltése Excelként (.xlsx)</button>
    <div class="status-badge" id="localStatus">Helyben mentett adatok: 0 sor (Feltöltendő: 0)</div>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-save" onclick="saveRecord()">💾 Mentés</button>
    <button class="btn btn-sync" onclick="syncCloud()">☁️ Feltöltés</button>
  </div>

    // IndexedDB inicializálás
    let db;
    const request = indexedDB.open("MadarAppDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      db.createObjectStore("megfigyelesek", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      updateStatusBadge();
      populateDatalists();
    };

    function initForm() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      document.getElementById('entryDate').value = `${y}.${m}.${d}`;

      const dlFaj = document.getElementById('fajList');
      FAJOK.forEach(faj => {
        const opt = document.createElement('option');
        opt.value = faj;
        dlFaj.appendChild(opt);
      });
    }

    function addObserverField() {
      const container = document.getElementById('observerContainer');
      const count = container.querySelectorAll('input').length + 1;
      const inp = document.createElement('input');
      inp.type = "text";
      inp.className = "obs-input uppercase";
      inp.setAttribute("list", "obsList");
      inp.placeholder = `MEGFIGYELŐ ${count}`;
      container.appendChild(inp);
    }

    function calcSum() {
      const fields = ['num_pld', 'num_him', 'num_tojo', 'num_ad', 'num_juv', 'num_imm', 'num_pull'];
      let sum = 0;
      let hasVal = false;
      fields.forEach(id => {
        const v = parseInt(document.getElementById(id).value, 10);
        if (!isNaN(v)) {
          sum += v;
          hasVal = true;
        }
      });
      document.getElementById('num_ossz').value = hasVal ? sum : '';
    }

    function parseVal(id) {
      const v = parseInt(document.getElementById(id).value, 10);
      return isNaN(v) ? "" : v;
    }

    function saveRecord() {
      const datum = document.getElementById('entryDate').value.trim();
      const terulet = document.getElementById('entryTerulet').value.trim().toUpperCase();
      const korzet = document.getElementById('entryKorzet').value.trim().toUpperCase();
      let faj = document.getElementById('entryFaj').value.trim();
      
      const obsInputs = document.querySelectorAll('.obs-input');
      const megfigyelo1 = obsInputs[0].value.trim().toUpperCase();

      if (!datum || !terulet || !faj || !megfigyelo1) {
        alert("Az Időpont, Terület, Faj és Megfigyelő 1 kitöltése kötelező!");
        return;
      }

      const pld = parseVal('num_pld');
      const him = parseVal('num_him');
      const tojo = parseVal('num_tojo');
      const ad = parseVal('num_ad');
      const juv = parseVal('num_juv');
      const imm = parseVal('num_imm');
      const pull = parseVal('num_pull');
      const ossz = parseVal('num_ossz');

      if (pld === "" && him === "" && tojo === "" && ad === "" && juv === "" && imm === "" && pull === "") {
        alert("A mennyiségi rubrikák közül legalább egyet kötelező kitölteni!");
        return;
      }

      if (faj === "Egyéb nem meghatározott") {
        const egyeb = prompt("Kérlek add meg az egyéb faj nevét:");
        faj = egyeb && egyeb.trim() ? "EGYÉB: " + egyeb.trim().toUpperCase() : "EGYÉB NEM MEGHATÁROZOTT";
      }

      const record = {
        "Időpont": datum,
        "Terület": terulet,
        "Körzet": korzet,
        "Faj": faj,
        "pld.": pld,
        "Hím": him,
        "Tojó": tojo,
        "Ad": ad,
        "Juv": juv,
        "Imm": imm,
        "Pull": pull,
        "Össz": ossz,
        "Megfigyelő 1": megfigyelo1,
        "Megjegyzés": document.getElementById('txtMegjegyzes').value.trim(),
        "Feltoltve": false
      };

      obsInputs.forEach((inp, idx) => {
        if (idx > 0) {
          const val = inp.value.trim().toUpperCase();
          if (val) record[`Megfigyelő ${idx + 1}`] = val;
        }
      });

      const tx = db.transaction("megfigyelesek", "readwrite");
      tx.objectStore("megfigyelesek").add(record);
      tx.oncomplete = () => {
        alert("Adat sikeresen rögzítve a telefonon!");
        clearForm();
        updateStatusBadge();
        populateDatalists();
      };
    }

    function clearForm() {
      document.getElementById('entryFaj').value = '';
      ['num_pld', 'num_him', 'num_tojo', 'num_ad', 'num_juv', 'num_imm', 'num_pull', 'num_ossz'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('txtMegjegyzes').value = '';
    }

    function updateStatusBadge() {
      const tx = db.transaction("megfigyelesek", "readonly");
      const store = tx.objectStore("megfigyelesek");
      const req = store.getAll();
      req.onsuccess = () => {
        const all = req.result;
        const unsynced = all.filter(r => !r.Feltoltve).length;
        document.getElementById('localStatus').innerText = `Helyben mentett: ${all.length} sor (Feltöltésre vár: ${unsynced})`;
      };
    }

    function populateDatalists() {
      const tx = db.transaction("megfigyelesek", "readonly");
      const store = tx.objectStore("megfigyelesek");
      const req = store.getAll();
      req.onsuccess = () => {
        const all = req.result;
        const teruletek = new Set();
        const megfigyelok = new Set();

        all.forEach(r => {
          if (r["Terület"]) teruletek.add(r["Terület"]);
          Object.keys(r).forEach(k => {
            if (k.startsWith("Megfigyelő") && r[k]) megfigyelok.add(r[k]);
          });
        });

        const dlTer = document.getElementById('teruletList');
        dlTer.innerHTML = '';
        teruletek.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          dlTer.appendChild(opt);
        });

        const dlObs = document.getElementById('obsList');
        dlObs.innerHTML = '';
        megfigyelok.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          dlObs.appendChild(opt);
        });
      };
    }

    async function syncCloud() {
      if (!navigator.onLine) {
        alert("Nincs internetkapcsolat!");
        return;
      }

      const tx = db.transaction("megfigyelesek", "readonly");
      const store = tx.objectStore("megfigyelesek");
      const req = store.getAll();

      req.onsuccess = async () => {
        const unsynced = req.result.filter(r => !r.Feltoltve);
        if (unsynced.length === 0) {
          alert("Minden megfigyelés szinkronizálva van már!");
          return;
        }

        try {
          // Google Apps Script hívás
          await fetch(FELHO_API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ uj_megfigyelesek: unsynced })
          });

          // Átjelölés feltöltöttre
          const writeTx = db.transaction("megfigyelesek", "readwrite");
          const writeStore = writeTx.objectStore("megfigyelesek");
          unsynced.forEach(rec => {
            rec.Feltoltve = true;
            writeStore.put(rec);
          });

          writeTx.oncomplete = () => {
            alert(`${unsynced.length} új megfigyelés feltöltve a Google Táblázatba!`);
            updateStatusBadge();
          };
        } catch (err) {
          alert("Hiba a feltöltés során: " + err.message);
        }
      };
    }

    function exportToExcel() {
      const tx = db.transaction("megfigyelesek", "readonly");
      const store = tx.objectStore("megfigyelesek");
      const req = store.getAll();
      req.onsuccess = () => {
        const data = req.result;
        if (data.length === 0) {
          alert("Nincs mentett adat az exportáláshoz!");
          return;
        }
        const cleanData = data.map(item => {
          const copy = Object.assign({}, item);
          delete copy.id;
          return copy;
        });

        const ws = XLSX.utils.json_to_sheet(cleanData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Megfigyelesek");
        XLSX.writeFile(wb, "madarmegfigyelesek_mobil.xlsx");
      };
    }

    function alertHelp(key) { alert(SUGO[key] || "Nincs leírás."); }
    function alertFullHelp() {
      alert(Object.entries(SUGO).map(([k, v]) => `• ${k.toUpperCase()}:\n${v}`).join("\n\n"));
    }

    // Service Worker regisztráció offline működéshez
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    initForm();
  </script>
</body>
</html>
